name: build-android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-signing.p12
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore fixed Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing fixed Android keystore'; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'Missing fixed Android keystore password'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 确认 Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_SDK_ROOT/platforms | tail -3 || true
      - name: 安装需要的 SDK 平台
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v3
      - name: 单元测试（协议回归与卡片渲染检查）
        working-directory: android
        run: gradle test --no-daemon

      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Verify fixed signing certificate and package
        run: |
          mkdir -p android/release-artifacts
          APK=android/app/build/outputs/apk/release/app-release.apk
          VERSION="$(awk -F '"' '/versionName =/{print $2}' android/app/build.gradle.kts)"
          test -n "$VERSION"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee android/release-artifacts/signing-certificate.txt
          grep -qi '946f9707c7eb40b6f5a7bdc75e1f49c0b9ff97f846a15ebc15cc21b2c1ae34ba' android/release-artifacts/signing-certificate.txt
          cp "$APK" "android/release-artifacts/todocard-android-$VERSION.apk"
          cd android/release-artifacts
          sha256sum ./*.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-card-previews
          path: android/app/build/reports/card-previews/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: todocard-release-apk
          path: android/release-artifacts/*
      - name: Remove runner signing material
        if: always()
        run: rm -f -- "$ANDROID_KEYSTORE_PATH"
